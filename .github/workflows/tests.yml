name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot:
    name: Godot regression and interface checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Install a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null

      - name: Import the project
        run: ~/godot/godot --headless --path . --import --quit

      - name: Verify runtime errors fail the test runner
        run: python3 tools/test_runner_self_check.py ~/godot/godot

      - name: Regression tests
        run: timeout 900 ~/godot/godot --headless --path . --script tests/run_tests.gd

      - name: Northern Passage outcomes and deterministic replay
        run: python3 tools/verify_northern_passage.py ~/godot/godot

      - name: Northern Passage graphical checks (1280 x 720)
        run: timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . --resolution 1280x720 --script tools/passage_playtest.gd -- --policy=escort --seed=31 --capture

      - name: Northern Passage graphical checks (1920 x 1080)
        run: timeout 600 xvfb-run -a -s "-screen 0 1920x1080x24" ~/godot/godot --path . --resolution 1920x1080 --script tools/passage_playtest.gd -- --policy=escort --seed=31 --capture

      - name: Command Watch mouse and patrol checks (1280 x 720)
        run: timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --audio-driver Dummy --path . --resolution 1280x720 --script tools/command_watch_playtest.gd -- --seed=31 --capture

      - name: Command Watch mouse and patrol checks (1920 x 1080)
        run: timeout 600 xvfb-run -a -s "-screen 0 1920x1080x24" ~/godot/godot --audio-driver Dummy --path . --resolution 1920x1080 --script tools/command_watch_playtest.gd -- --seed=31 --capture

      - name: Command deck checks (1600 x 900)
        run: timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ~/godot/godot --path . --resolution 1600x900 -- --cold-war-smoke

      - name: Contact intent and camera mouse checks (1280 x 720)
        run: timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --audio-driver Dummy --path . --resolution 1280x720 --script tools/fleet_command_playtest.gd -- --seed=31 --capture

      - name: Contact intent and camera mouse checks (1920 x 1080)
        run: timeout 600 xvfb-run -a -s "-screen 0 1920x1080x24" ~/godot/godot --audio-driver Dummy --path . --resolution 1920x1080 --script tools/fleet_command_playtest.gd -- --seed=31 --capture

      - name: Air missions and stations, mouse and keyboard (1280 x 720)
        run: timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --audio-driver Dummy --path . --resolution 1280x720 --script tools/air_mission_playtest.gd -- --output-dir=res://work/ci-air-1280

      - name: Air missions and stations, mouse and keyboard (1920 x 1080)
        run: timeout 600 xvfb-run -a -s "-screen 0 1920x1080x24" ~/godot/godot --audio-driver Dummy --path . --resolution 1920x1080 --script tools/air_mission_playtest.gd -- --output-dir=res://work/ci-air-1920

      - name: Air operations checks
        run: timeout 600 xvfb-run -a -s "-screen 0 1600x1000x24" ~/godot/godot --path . --resolution 1600x1000 -- --aviation-smoke

      - name: Fleet workshop checks (1600 x 900)
        run: timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ~/godot/godot --path . --resolution 1600x900 -- --fleet-workshop-smoke --scenario-storage=res://work/ci-workshop-1600

      - name: Fleet workshop checks (1280 x 720)
        run: timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . --resolution 1280x720 -- --fleet-workshop-smoke --scenario-storage=res://work/ci-workshop-1280

      - name: Weapon control checks (1600 x 900)
        run: timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ~/godot/godot --path . --resolution 1600x900 -- --weapon-control-smoke --scenario-storage=res://work/ci-weapons-1600

      - name: Weapon control checks (1280 x 720)
        run: timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path . --resolution 1280x720 -- --weapon-control-smoke --scenario-storage=res://work/ci-weapons-1280
